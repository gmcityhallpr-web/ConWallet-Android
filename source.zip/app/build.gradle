plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.co.conwallet'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.co.conwallet'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            if (variant.buildType.name == 'debug') {
                outputFileName = 'wookwallet.apk'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Android Studio에서 Debug APK를 만들면 맥의 다운로드 폴더에도 자동으로 복사합니다.
def copyDebugApkToDownloads = tasks.register('copyDebugApkToDownloads', Copy) {
    from(layout.buildDirectory.file('outputs/apk/debug/wookwallet.apk'))
    into(new File(System.getProperty('user.home'), 'Downloads'))
    rename { '디지털폐지수집.apk' }
}

afterEvaluate {
    tasks.named('assembleDebug').configure {
        finalizedBy(copyDebugApkToDownloads)
    }
}

dependencies {
    // Android 12+ 시스템 스플래시를 앱 첫 화면과 한 애니메이션처럼 연결
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // 기프티콘 이미지 OCR: 한국어 + 영문
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    // QR / 바코드 인식
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
