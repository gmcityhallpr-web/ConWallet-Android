<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Black Han Sans"; src: url(fonts/BlackHanSans-Regular.ttf); }
@font-face { font-family: "Inter Tight"; src: url(fonts/InterTight.ttf); font-weight: 100 900; }
@font-face { font-family: "DM Mono"; src: url(fonts/DMMono-Medium.ttf); font-weight: 500; }
html,body { margin:0; background:#000; overflow:hidden; }
canvas { display:block; }
</style></head>
<body>
<canvas id="c"></canvas>
<script src="engine.js"></script>
<script src="film.js"></script>
<script>
const cv = document.getElementById('c');
cv.width = G.W; cv.height = G.H;
const ctx = cv.getContext('2d');
window.DUR = FILM.DUR;
window.EV = FILM.EV;
window.render = (t) => FILM.render(ctx, t);
window.TEXTS = (t) => { FILM.render(ctx, t); return FILM.texts(); };
Promise.all([
  '40px "Black Han Sans"', '900 40px "Inter Tight"', '500 20px "DM Mono"',
].map((f) => document.fonts.load(f, 'Aa가학산수목원환영의정원온재사계도담숲이끼무료개테마'))).then(() => { render(0); window.READY = true; });
</script>
</body></html>
