async function write(method,p,id){let url=SB+'/rest/v1/home_style_items'+(method==='PATCH'?`?id=eq.${id}&user_id=eq.${S.user.id}`:'');let r=await raw(url,{method,headers:{...authHeaders(),Prefer:'return=minimal'},body:JSON.stringify(p),keepalive:true});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.message||'서버 저장 실패')}}function openWishForm(x=null){wishEditing=x;$('#wtitle').textContent=x?'위시 수정':'위시 추가';$('#wdel').classList.toggle('hide',!x);$('#wlink').value=x?.link??'';$('#wname').value=x?.name??'';$('#wimg').value=x?.image??'';$('#wcat').value=x?.category??'';$('#wpriority').value=x?.priority??'보통';$('#wprice').value=x?.price??'';$('#wmemo').value=x?.memo??'';msg($('#wfm'),'');$('#wmodal').classList.remove('hide')}
$('#wadd').onclick=$('#wfab').onclick=()=>openWishForm();$('#wx').onclick=()=>$('#wmodal').classList.add('hide');$('#wmodal').onmousedown=e=>{if(e.target===$('#wmodal'))$('#wmodal').classList.add('hide')};
async function writeWish(method,p,id){let url=SB+'/rest/v1/wishlist_items'+(method==='PATCH'?`?id=eq.${id}&user_id=eq.${S.user.id}`:'');let r=await raw(url,{method,headers:{...authHeaders(),Prefer:'return=minimal'},body:JSON.stringify(p),keepalive:true});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.message||'서버 저장 실패')}}
$('#wform').onsubmit=e=>{e.preventDefault();const full={user_id:S.user.id,name:$('#wname').value.trim(),link:safe($('#wlink').value)||null,image:safe($('#wimg').value)||null,category:$('#wcat').value.trim()||null,price:num($('#wprice').value),priority:$('#wpriority').value,memo:$('#wmemo').value.trim()||null};const edit=!!wishEditing,id=edit?wishEditing.id:uid(),previous=edit?{...wishEditing}:null;let payload;if(edit){payload={};for(const k of ['name','link','image','category','price','priority','memo']){const before=wishEditing[k]??null,after=full[k]??null;if(String(before)!==String(after))payload[k]=full[k]}if(!Object.keys(payload).length){$('#wmodal').classList.add('hide');wishEditing=null;toast('변경사항이 없습니다');return}wishItems=wishItems.map(x=>x.id===id?{...x,...payload,updated_at:new Date().toISOString()}:x)}else{if(!full.name)full.name='이름 없음';payload={...full,id};let now=new Date().toISOString();wishItems=[{...payload,created_at:now,updated_at:now},...wishItems]}renderWish();$('#wmodal').classList.add('hide');wishEditing=null;toast('저장 중…');writeWish(edit?'PATCH':'POST',payload,id).then(()=>{wishLast=Date.now();toast(edit?'위시가 수정되었습니다 ✓':'위시리스트에 추가했습니다 ✓')}).catch(er=>{if(edit&&previous)wishItems=wishItems.map(x=>x.id===id?previous:x);else wishItems=wishItems.filter(x=>x.id!==id);renderWish();toast('저장 실패 · '+er.message)})};
$('#wdel').onclick=()=>{if(!wishEditing||!confirm('위시리스트에서 삭제할까요?'))return;let x=wishEditing,id=x.id;wishItems=wishItems.filter(i=>i.id!==id);renderWish();$('#wmodal').classList.add('hide');wishEditing=null;toast('삭제 중…');raw(SB+`/rest/v1/wishlist_items?id=eq.${id}&user_id=eq.${S.user.id}`,{method:'DELETE',headers:{...authHeaders(),Prefer:'return=minimal'},keepalive:true}).then(r=>{if(!r.ok)throw 0;toast('삭제되었습니다 ✓')}).catch(()=>{wishItems=[x,...wishItems];renderWish();toast('삭제 실패')})};
$('#wauto').onclick=async()=>{let u=safe($('#wlink').value);if(!u)return msg($('#wfm'),'제품 링크를 넣어주세요.');$('#wauto').textContent='…';try{let r=await raw(PRE+'?preview='+encodeURIComponent(u),{headers:{Authorization:'Bearer '+S.access_token}}),d=await r.json();if(!r.ok)throw Error(d.error||'자동 채우기 실패');if(!$('#wname').value)$('#wname').value=d.title||'';if(d.image)$('#wimg').value=d.image;msg($('#wfm'),'자동 채우기 완료')}catch(e){msg($('#wfm'),e.message)}finally{$('#wauto').textContent='자동 채우기'}};
$('#form').onsubmit=e=>{e.preventDefault();
  const full={
    user_id:S.user.id,
    name:$('#name').value.trim(),
    link:safe($('#link').value)||null,
    image:safe($('#img').value)||null,
    room:$('#room').value,
    category:$('#cat').value,
    width_mm:num($('#w').value),
    depth_mm:num($('#d').value),
    height_mm:num($('#h').value),
    size_approx:$('#approx').checked,
    color:$('#color').value.trim()||null,
    price:num($('#price').value),
    status:$('#status').value,
    purchase_date:$('#date').value||(['구매완료','선물받음'].includes($('#status').value)?today():null),
    memo:$('#memo').value.trim()||null
  };
  const edit=!!editing;
  const id=edit?editing.id:uid();
  const previous=edit?{...editing}:null;
  let payload;

  if(edit){
    payload={};
    const keys=['name','link','image','room','category','width_mm','depth_mm','height_mm','size_approx','color','price','status','purchase_date','memo'];
    for(const k of keys){
      const before=editing[k]??null;
      const after=full[k]??null;
      if(String(before)!==String(after)) payload[k]=full[k];
    }
    if(!Object.keys(payload).length){
      $('#modal').classList.add('hide');
      editing=null;
      toast('변경사항이 없습니다');
      return;
    }
    items=items.map(x=>x.id===id?{...x,...payload,updated_at:new Date().toISOString()}:x);
  }else{
    // 새 아이템도 특정 필드 하나만 입력해도 저장 가능하도록 이름이 없으면 기본 표시명을 사용.
    if(!full.name) full.name='이름 없음';
    payload={...full,id};
    const now=new Date().toISOString();
    items=[{...payload,created_at:now,updated_at:now},...items];
  }

  render();
  $('#modal').classList.add('hide');
  editing=null;
  toast('저장 중…');

  write(edit?'PATCH':'POST',payload,id).then(()=>{
    last=Date.now();
    toast(edit?'수정사항이 저장되었습니다 ✓':'아이템이 추가되었습니다 ✓');
  }).catch(er=>{
    if(edit&&previous) items=items.map(x=>x.id===id?previous:x);
    else items=items.filter(x=>x.id!==id);
    render();
    toast('저장 실패 · '+er.message);
  });
};
$('#del').onclick=()=>{if(!editing||!confirm('삭제할까요?'))return;let x=editing,id=x.id;items=items.filter(i=>i.id!==id);render();$('#modal').classList.add('hide');editing=null;toast('삭제 중…');raw(SB+`/rest/v1/home_style_items?id=eq.${id}&user_id=eq.${S.user.id}`,{method:'DELETE',headers:{...authHeaders(),Prefer:'return=minimal'},keepalive:true}).then(r=>{if(!r.ok)throw 0;toast('삭제되었습니다 ✓')}).catch(()=>{items=[x,...items];render();toast('삭제 실패')})};
$('#auto').onclick=async()=>{let u=safe($('#link').value);if(!u)return msg($('#fm'),'제품 링크를 넣어주세요.');$('#auto').textContent='…';try{let r=await raw(PRE+'?preview='+encodeURIComponent(u),{headers:{Authorization:'Bearer '+S.access_token}}),d=await r.json();if(!r.ok)throw Error(d.error||'자동 채우기 실패');if(!$('#name').value)$('#name').value=d.title||'';if(d.image)$('#img').value=d.image;msg($('#fm'),'자동 채우기 완료')}catch(e){msg($('#fm'),e.message)}finally{$('#auto').textContent='자동 채우기'}};$('#q').oninput=render;$('#wq').oninput=renderWish;$('#sync').onclick=()=>sync(true);$('#wsync').onclick=()=>syncWish(true);function syncCurrent(force=false){currentView==='wish'?syncWish(force):sync(force)}addEventListener('focus',()=>syncCurrent());document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncCurrent()});addEventListener('online',()=>syncCurrent(true));showApp();
</script></body></html>
