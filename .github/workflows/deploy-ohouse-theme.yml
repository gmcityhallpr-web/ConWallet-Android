name: Deploy Ohouse Theme

on:
  push:
    paths:
      - '.github/workflows/deploy-ohouse-theme.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject theme stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('home-style-board/index.html')
          s=p.read_text()
          tag='<link rel="stylesheet" href="theme.css">'
          if tag not in s:
              s=s.replace('</head>', tag+'</head>')
              p.write_text(s)
          PY
      - name: Commit safe UI link
        run: |
          git config user.name "gmcityhallpr-web"
          git config user.email "gmcityhall.pr@gmail.com"
          git add home-style-board/index.html home-style-board/theme.css
          git diff --cached --quiet || git commit -m "Apply Ohouse-inspired UI theme"
          git push
      - name: Package site
        run: |
          cd home-style-board
          zip -q -r ../home-style.zip .
      - name: Upload to Netlify
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 -X POST \
            -F "zip=@home-style.zip;type=application/zip" \
