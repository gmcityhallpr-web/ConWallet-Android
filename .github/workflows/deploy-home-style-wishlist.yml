name: Deploy Home Style Wishlist

on:
  push:
    paths:
      - '.github/workflows/deploy-home-style-wishlist.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write updated app
        shell: bash
        run: |
          cat > /tmp/app.b64 <<'EOF'
          
          EOF
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          b=''.join(Path('/tmp/app.b64').read_text().split())
          Path('home-style-board/index.html').write_bytes(gzip.decompress(base64.b64decode(b)))
          PY
      - name: Save source
        run: |
          git config user.name "home-style-bot"
          git config user.email "actions@users.noreply.github.com"
          git add home-style-board/index.html
          git commit -m "Add separate wishlist screen" || true
          git push
      - name: Deploy to Netlify
        run: |
          cd home-style-board
          zip -q -r ../home-style.zip .
          cd ..
          curl --fail-with-body --retry 3 -X POST \
            -F "zip=@home-style.zip;type=application/zip" \
            "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..gW6wdXXspXkD_jeL.G0ckoB3bgBHYQ-5O7TNHhDQes7rCB8Ib7IRgDTOhBN7QIXHf3iXC6rE3jKCh71ObJTfi5kBYlG7eDlfu3pR92xDTTw8T588wYWCiHwJ9-uXMDP3oA59GUR8WyiU9pBOQCXjIYTCZ0Usosnd6UIaxJSrLgR_gYW1keZTmfPbq5tEg_ooSpY8hbo1n2DZvyeJf9-VwlkfaT9GrZt-AdE4xzi6lddcVvNtPVbI5R1ItD1pXTn_hzkFieNH5fjZm5z5COtGf3R5XmDzXuxpdVtl7QDYUTQJqzH0wxHdo_9fgF6IulW-GZ1TYh7eEBh8PCimn7ogWkPKLRRVcQRUfvvS5Ep-LD82YFMmM6KMaXQ38X0EsSEAAy3d5ynn1djvRATSci0kUYEDj.SkvWsiGI52W5nwlDWBdjMQ/api/v1/sites/9dabdef1-d3c0-4e66-8191-4a8ecbce5df9/builds" \
