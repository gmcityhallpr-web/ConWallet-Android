name: Deploy Home Style to Netlify

on:
  push:
    paths:
      - 'home-style-board/**'
      - '.github/workflows/deploy-home-style-netlify.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package site
        run: |
          cd home-style-board
          zip -q -r ../home-style.zip .
      - name: Upload to Netlify
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 -X POST \
            -F "zip=@home-style.zip;type=application/zip" \
            "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..9tn1kQYkyXPfu8ph.VvlHwbVenZ_Yc6krZUH8bCX5NKAwZ2A2lbisdAPbS5adrM41-RFB-3I_paD_3jO2_SaLhId6wXgcQ2NUlHCZbeTW-dGeQInJgXuHXIBiSrmZ51j-4z07nlNX-rTHIMMl_95N2qXY7Oi1m8h1uDunV5hoBriB4teq7zAAI-HwiTvOlIbH7nO6L7pG9QXsk5UtrrjVx9GPHBt4tVNtRMipiGEJtGKYI11fEHvD3QuRmelxBOzFTCfl17L1BBYJmLIENTUGNzK3qWYTNpqYeJGRkj-nvpqEztd0eUPNRPGKyWx_zmLD98Xdxzxc2nWU6cJolJV7ItMRcyQAkQjRNTt_sd5rJvle9EMcF-u91u8Pxci7xUBIBKsgfoY7qMFyLlqBvFZyW-LI.-_oJSrErBW4ysdgDPCrsow/api/v1/sites/9dabdef1-d3c0-4e66-8191-4a8ecbce5df9/builds" \
